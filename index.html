<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="description" content="YAKOOT - متجر ياقوت">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="styles.css">
<title>YAKOOT | ياقوت</title>
</head>
<body>
<header class="topbar">
  <button id="menuBtn" class="icon-btn" aria-label="القائمة">☰</button>
  <div class="brand"><img src="assets/logo.png" alt="YAKOOT"><span>YAKOOT</span></div>
  <button id="cartBtn" class="icon-btn" aria-label="السلة">🛒 <b id="cartCount">0</b></button>
</header>
<main>
  <section class="hero-banner-wrap">
    <img class="hero-banner" src="assets/hero-banner.png" alt="YAKOOT STORE - أسلوبك يبدأ من هنا">
  </section>
  <section class="toolbar">
    <input id="search" placeholder="ابحث عن منتج..." aria-label="البحث عن منتج">
    <select id="category" aria-label="القسم"><option value="">كل الأقسام</option></select>
  </section>
  <section id="products" class="products"></section>
</main>
<aside id="drawer" class="drawer">
  <div class="drawer-head"><h2>سلة المشتريات</h2><button onclick="closeCart()">×</button></div>
  <div id="cartItems"></div>
  <div class="cart-total"><span>الإجمالي</span><strong id="cartTotal">0 ج.م</strong></div>
  <button class="primary full" onclick="checkout()">إتمام الطلب</button>
</aside>
<div id="overlay" class="overlay" onclick="closeCart()"></div>
<footer>© YAKOOT — متجر ياقوت</footer>
<script src="config.js"></script><script src="supabase-client.js"></script><script src="app.js"></script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}</script>
</body>
</html>
