<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<link rel="stylesheet" href="styles.css">
<title>YAKOOT | لوحة الإدارة</title>
<style>
:root{--gold:#f5b84b;--gold2:#d99a2b;--bg:#08080a;--panel:#111116;--line:#292930;--muted:#9b9ba3;--danger:#e05252}
body{background:radial-gradient(circle at 85% -10%,#2a1d0d 0,#08080a 32%),#08080a;color:#f7f3ea;min-height:100vh}
.topbar{height:72px;background:#0b0b0eee;border-bottom:1px solid #2a241b;padding:0 20px;gap:15px}
.topbar>a{color:#f5b84b!important;font-weight:800;border:1px solid #3b301f;border-radius:12px;padding:9px 13px}
.brand{margin:auto;letter-spacing:1px}.brand img{width:42px;height:42px;border-radius:12px;border:1px solid #4a3820}.brand span{font-size:17px}
.admin-wrap{max-width:1100px!important;margin:0 auto!important;padding:24px 18px 50px!important}
.card{background:linear-gradient(180deg,#141419,#101014);border:1px solid #29282d;box-shadow:0 14px 45px #0005}
#loginBox{border-color:#3a2c18!important;margin-top:8vh!important;text-align:right}
#loginBox h1{margin-top:0;color:var(--gold)}
.form-input{width:100%;margin:7px 0;padding:13px 14px;box-sizing:border-box;background:#0b0b0f;border:1px solid #303037;color:#fff;border-radius:12px;outline:none}
.form-input:focus{border-color:#8b662c;box-shadow:0 0 0 3px #f5b84b14}
.primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#17120a;border-radius:12px;padding:12px 20px;box-shadow:0 8px 22px #d99a2b22}
.admin-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 20px}.admin-title h1{margin:0;font-size:30px}.admin-title p{color:var(--muted);margin:5px 0 0}
.section{padding:18px;margin-bottom:18px}.section h2{margin:0 0 14px;color:#f5f0e6;font-size:20px}.section h2 span{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid .wide{grid-column:1/-1}
.product-row{display:grid;grid-template-columns:74px 1fr auto;gap:13px;align-items:center;padding:12px;margin:9px 0;border-radius:14px;background:#0d0d11;border:1px solid #24242a}.product-row img{width:74px;height:74px;border-radius:12px;object-fit:cover;background:#18181c}.product-info b{display:block;margin-bottom:5px}.product-info small{color:var(--muted)}.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#48c774;margin-left:5px}.status-dot.off{background:#777}
.danger{background:#2a1214;color:#ffb0b0;border:1px solid #542124;border-radius:10px;padding:9px 12px}.order-card{padding:16px;margin:10px 0;border-radius:15px;background:#0d0d11;border:1px solid #27272d}.order-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.order-head b{font-size:17px}.order-meta{color:#aaa;font-size:13px;line-height:1.8;margin:7px 0}.order-items{padding-top:10px;margin-top:10px;border-top:1px solid #24242a;color:#ddd}.status-select{background:#17171c;color:#fff;border:1px solid #3a3a42;border-radius:9px;padding:8px 10px}
.empty{color:#888;padding:15px;text-align:center}.hint{color:#85858e;font-size:12px;margin-top:6px}.image-preview{display:none;margin-top:10px;max-width:120px;height:120px;object-fit:cover;border-radius:14px;border:1px solid #3b3427}
@media(max-width:700px){.grid{grid-template-columns:1fr}.grid .wide{grid-column:auto}.product-row{grid-template-columns:58px 1fr}.product-row img{width:58px;height:58px}.product-row button{grid-column:1/-1;width:100%}.admin-title{align-items:flex-start;flex-direction:column}.topbar{padding:0 12px}.brand span{font-size:14px}}
</style>
</head>
<body>
<header class="topbar">
<a href="index.html">← المتجر</a>
<div class="brand"><img src="assets/yakoot-logo.jpg" alt="YAKOOT"><span>YAKOOT | لوحة الإدارة</span></div>
<button id="logout" class="icon-btn" style="display:none">تسجيل الخروج</button>
</header>
<main class="admin-wrap">
<section id="loginBox" class="card section">
<h1>🔐 دخول الإدارة</h1>
<p class="hint">سجّل الدخول بحساب المدير لإدارة المنتجات والطلبات.</p>
<input id="email" class="form-input" type="email" placeholder="البريد الإلكتروني" autocomplete="username">
<input id="password" class="form-input" type="password" placeholder="كلمة المرور" autocomplete="current-password">
<button class="primary" onclick="login()">دخول لوحة الإدارة</button>
</section>
<section id="panel" style="display:none">
<div class="admin-title"><div><h1>لوحة التحكم</h1><p>إدارة منتجات ومتجر YAKOOT والطلبات الواردة</p></div></div>
<section class="card section">
<h2><span>＋</span> إضافة منتج جديد</h2>
<div class="grid">
<input id="name" class="form-input" placeholder="اسم المنتج">
<input id="price" class="form-input" type="number" min="0" step="0.01" placeholder="السعر بالجنيه المصري">
<input id="cat" class="form-input" placeholder="الفئة">
<input id="stock" class="form-input" type="number" min="0" value="0" placeholder="الكمية في المخزون">
<div class="wide">
<input id="image" class="form-input" placeholder="رابط صورة المنتج (اختياري)">
<img id="imagePreview" class="image-preview" alt="معاينة الصورة">
<div class="hint">اتركه فارغًا لاستخدام شعار YAKOOT بدلًا من الصورة.</div>
</div>
</div>
<button class="primary" onclick="addProduct()">إضافة المنتج</button>
</section>
<section class="card section">
<h2>🛍️ المنتجات</h2>
<div id="list"><div class="empty">جاري تحميل المنتجات…</div></div>
</section>
<section class="card section">
<h2>📦 الطلبات</h2>
<div id="orders"><div class="empty">جاري تحميل الطلبات…</div></div>
</section>
</section>
</main>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script>
let sb;
const statusNames={new:'جديد',confirmed:'تم التأكيد',preparing:'قيد التجهيز',shipped:'تم الشحن',delivered:'تم التسليم',cancelled:'ملغي'};
window.addEventListener('supabase-ready',async()=>{sb=window.supabaseClient;const {data:{session}}=await sb.auth.getSession();if(session)showPanel();});
async function login(){if(!sb)return alert('جارٍ تجهيز الاتصال بقاعدة البيانات، حاول مرة أخرى.');const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value; if(!email||!password)return alert('أدخل البريد الإلكتروني وكلمة المرور.');const {error}=await sb.auth.signInWithPassword({email,password});if(error)return alert('بيانات الدخول غير صحيحة.');showPanel()}
async function showPanel(){document.getElementById('loginBox').style.display='none';document.getElementById('panel').style.display='block';document.getElementById('logout').style.display='block';await Promise.all([loadProducts(),loadOrders()])}
async function logout(){await sb.auth.signOut();location.reload()}
document.getElementById('logout').onclick=logout;
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function imgUrl(v){return v&&String(v).trim()?v:'assets/yakoot-logo.jpg'}
async function loadProducts(){const {data,error}=await sb.from('products').select('*').order('created_at',{ascending:false});if(error)return document.getElementById('list').innerHTML='<div class="empty">تعذر تحميل المنتجات: '+esc(error.message)+'</div>';document.getElementById('list').innerHTML=(data||[]).map(x=>`<div class="product-row"><img src="${esc(imgUrl(x.image_url))}" alt="${esc(x.name)}" onerror="this.src='assets/yakoot-logo.jpg'"><div class="product-info"><b>${esc(x.name)}</b><small>${Number(x.price||0).toLocaleString('ar-EG')} ج.م · ${esc(x.category||'عام')} · المخزون: ${Number(x.stock||0)}</small><small><span class="status-dot ${x.active?'':'off'}"></span>${x.active?'نشط':'مخفي'}</small></div><button class="danger" onclick="del('${x.id}')">حذف</button></div>`).join('')||'<div class="empty">لا توجد منتجات حتى الآن.</div>'}
async function addProduct(){const name=document.getElementById('name').value.trim(),price=Number(document.getElementById('price').value),category=document.getElementById('cat').value.trim()||'عام',image_url=document.getElementById('image').value.trim()||'assets/yakoot-logo.jpg',stock=Number(document.getElementById('stock').value)||0;if(!name||!price)return alert('أدخل اسم المنتج والسعر.');const {error}=await sb.from('products').insert({name,price,category,image_url,stock});if(error)return alert(error.message);['name','price','cat','image'].forEach(id=>document.getElementById(id).value='');document.getElementById('stock').value='0';document.getElementById('imagePreview').style.display='none';await loadProducts()}
async function del(id){if(!confirm('هل تريد حذف هذا المنتج نهائيًا؟'))return;const {error}=await sb.from('products').delete().eq('id',id);if(error)return alert(error.message);await loadProducts()}
async function loadOrders(){const {data,error}=await sb.from('orders').select('*,order_items(*)').order('created_at',{ascending:false});if(error)return document.getElementById('orders').innerHTML='<div class="empty">تعذر تحميل الطلبات: '+esc(error.message)+'</div>';document.getElementById('orders').innerHTML=(data||[]).map(o=>`<div class="order-card"><div class="order-head"><div><b>طلب #${esc(String(o.id).slice(0,8))}</b><div class="order-meta">العميل: ${esc(o.customer_name)}<br>الهاتف: ${esc(o.phone)}<br>العنوان: ${esc(o.address)}<br>الإجمالي: <strong>${Number(o.total||0).toLocaleString('ar-EG')} ج.م</strong></div></div><select class="status-select" onchange="setStatus('${o.id}',this.value)">${Object.entries(statusNames).map(([k,v])=>`<option value="${k}" ${o.status===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="order-items">${(o.order_items||[]).map(i=>`<div>• ${esc(i.product_name)} × ${Number(i.quantity||0)}</div>`).join('')||'لا توجد تفاصيل للمنتجات.'}</div></div>`).join('')||'<div class="empty">لا توجد طلبات حتى الآن.</div>'}
async function setStatus(id,status){const {error}=await sb.from('orders').update({status}).eq('id',id);if(error)alert('تعذر تحديث حالة الطلب: '+error.message)}
document.getElementById('image').addEventListener('input',e=>{const p=document.getElementById('imagePreview'),v=e.target.value.trim();if(!v){p.style.display='none';return}p.src=v;p.style.display='block';p.onerror=()=>{p.style.display='none'}});
</script>
</body></html>
